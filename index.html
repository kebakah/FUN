<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Number</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Guess the Number</h1>
    <p class="subtitle">I'm thinking of a number between <span id="rangeText">1 and 100</span>.</p>

    <div class="difficulty" role="group" aria-label="Difficulty">
      <button class="diff-btn active" data-min="1" data-max="50">Easy</button>
      <button class="diff-btn" data-min="1" data-max="100">Medium</button>
      <button class="diff-btn" data-min="1" data-max="500">Hard</button>
    </div>

    <form id="guessForm" class="guess-form">
      <input
        type="number"
        id="guessInput"
        placeholder="Enter your guess"
        autocomplete="off"
        required
      >
      <button type="submit">Guess</button>
    </form>

    <p id="feedback" class="feedback" aria-live="polite">Make your first guess!</p>

    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="attempts">0</span>
        <span class="stat-label">Attempts</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="best">–</span>
        <span class="stat-label">Best</span>
      </div>
    </div>

    <div class="history" id="history"></div>

    <button id="resetBtn" class="reset-btn">New Game</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
